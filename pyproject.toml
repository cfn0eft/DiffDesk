[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csvtool"
version = "0.1.0"
description = "CSV/Excelの比較・編集・Salesforce Data Loader用CSV生成ツール(ローカルWebアプリ+CLI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openpyxl>=3.1,<4",
    "charset-normalizer>=3.0,<4",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
csvtool = "csvtool.__main__:main"

[tool.setuptools.packages.find]
include = ["csvtool*"]

[tool.setuptools.package-data]
csvtool = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
